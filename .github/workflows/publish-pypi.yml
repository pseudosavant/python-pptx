name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.repository == 'pseudosavant/python-pptx'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ps-python-pptx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import glob, os, zipfile, email; p=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(p); m=email.message_from_bytes(z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA')))); assert os.environ['RELEASE_TAG'] == 'v' + m['Version']"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
